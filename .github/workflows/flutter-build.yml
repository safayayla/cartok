name: Flutter Build (Android / iOS)

# Cartok's Flutter SDK cannot be installed in the restricted sandbox this
# project was developed in (pub.dev / storage.googleapis.com are blocked
# there). This workflow runs on GitHub's own runners, which have normal
# internet access, so it is the real place `flutter create`, `flutter
# analyze`, `flutter test`, and `flutter build apk` actually execute.
#
# It does NOT touch backend/** (see backend-ci.yml for that) and it does
# NOT overwrite mobile/lib, mobile/test, or mobile/pubspec.yaml — platform
# generation only adds the missing android/ and ios/ folders alongside the
# existing Dart source.

on:
  push:
    branches: [main, develop]
    paths: ["mobile/**", ".github/workflows/flutter-build.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["mobile/**", ".github/workflows/flutter-build.yml"]
  workflow_dispatch: {}

# Flutter version: floating on the "stable" channel (no exact version
# pin), NOT because newest-is-best, but because the first real run
# proved a pin wrong. 3.24.3 (shipping Dart 3.5.3) was tried first as a
# known-good release compatible with the pubspec's own stated
# `sdk: ">=3.4.0 <4.0.0"` constraint — but the actual `flutter create`
# run on GitHub failed for real with:
#   "cartok depends on share_plus >=13.0.0 which requires SDK version
#    >=3.10.0 <4.0.0, version solving failed."
# share_plus ^13.1.0 was already declared in pubspec.yaml before this CI
# pass existed (added in an earlier session that had no SDK to verify
# against), and its real floor is newer than the pubspec's own stated
# Dart constraint admits. Rather than guess another specific version
# number from training data and risk the same failure again, "stable"
# with no pin always resolves to whatever GitHub's runners actually
# currently ship — which, being current, satisfies currently-published
# pub packages including share_plus ^13.1.0. If this ever needs to be
# reproducible/pinned again, pin it to whatever version this workflow's
# "Flutter doctor" step reports once a run has actually succeeded.
env:
  FLUTTER_CHANNEL: "stable"
  ANDROID_APP_ID: "com.cartok.app"

jobs:
  android:
    name: Android (generate, analyze, test, build)
    runs-on: ubuntu-latest
    # Explicit, because many orgs now default the workflow GITHUB_TOKEN to
    # read-only — without this, the "persist generated mobile/android/"
    # step's push fails with a 403 that's easy to misread as the earlier
    # build having failed instead.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          # cache: true was left off deliberately: subosito/flutter-action's
          # cache key does not vary when `flutter-version` is left empty
          # (only `channel` is used in the key), so a run with a pinned
          # version restored the exact same cache entry for this repo's
          # later "stable, no pin" run — a real, observed failure, not a
          # hypothetical one. Always install fresh until this is revisited.

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android platform project (only if missing)
        run: |
          set +e
          if [ ! -d "android" ]; then
            echo "mobile/android/ does not exist — generating it with the real Flutter CLI."
            # --project-name must stay "cartok" to match the existing pubspec.yaml
            # name (package:cartok/... imports throughout lib/ and test/ depend on
            # it) — changing it would break every existing import. Flutter's
            # convention makes applicationId = <org>.<project-name>, so this
            # produces "com.cartok.cartok", not the desired "com.cartok.app"; the
            # next step retargets just the applicationId/bundle id string, which
            # is independent of the Dart package name and safe to change.
            flutter create . --platforms=android --org com.cartok --project-name cartok > /tmp/create_android.log 2>&1
            ec=$?
            cat /tmp/create_android.log
            if [ $ec -ne 0 ]; then
              echo "::error::flutter create (android) failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/create_android.log | sed ':a;N;$!ba;s/\n/%0A/g')"
              exit $ec
            fi
            # flutter create also writes test/widget_test.dart — the stock
            # counter-app template test, referencing a MyApp widget this
            # project doesn't have. It doesn't touch any file our own
            # test/ subfolders already contain, but this one new top-level
            # file would fail to compile against our real app and break
            # `flutter test` for every real test alongside it. Remove it;
            # our actual coverage lives in test/features, test/navigation,
            # test/providers, test/helpers, untouched by flutter create.
            if [ -f "test/widget_test.dart" ] && grep -q "MyApp" "test/widget_test.dart"; then
              rm -f "test/widget_test.dart"
              echo "Removed the generated placeholder test/widget_test.dart (stock counter-app template, not ours)."
            fi
          else
            echo "mobile/android/ already exists — leaving it as-is."
          fi

      - name: Set Android application ID to com.cartok.app
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ] && grep -q "com.cartok.cartok" "$GRADLE_FILE"; then
            sed -i 's/com\.cartok\.cartok/com.cartok.app/g' "$GRADLE_FILE"
            echo "Rewrote applicationId/namespace in $GRADLE_FILE to ${{ env.ANDROID_APP_ID }}"
          fi
          echo "Checking $GRADLE_FILE for applicationId"
          grep -E "applicationId|namespace" "$GRADLE_FILE" || echo "::warning::Could not find applicationId in $GRADLE_FILE — verify manually."

      - name: flutter pub get
        run: |
          set +e
          flutter pub get > /tmp/pubget.log 2>&1
          ec=$?
          cat /tmp/pubget.log
          if [ $ec -ne 0 ]; then
            echo "::error::flutter pub get failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/pubget.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $ec
          fi

      - name: flutter analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          ec=$?
          cat /tmp/analyze.log
          if [ $ec -ne 0 ]; then
            # A plain tail of the log can cut off mid-line before the file:line
            # that actually matters, burying it under trailing "info"-level
            # lints that aren't why this failed (seen in run 37835967249 —
            # "9:25 • prefer_const_literals_to_create_immutables" with no file
            # name, because the real "error •" line was truncated away).
            # flutter analyze's default severity gate only fails the build on
            # "error"/"warning" lines, never plain "info" ones, so isolate
            # those specifically.
            BLOCKING=$(grep -E "^\s*(error|warning) •" /tmp/analyze.log)
            if [ -n "$BLOCKING" ]; then
              echo "::error::flutter analyze failed with exit $ec. The actual error/warning-level issue(s) (not the info-level ones below them):%0A$(echo "$BLOCKING" | sed ':a;N;$!ba;s/\n/%0A/g')"
            else
              echo "::error::flutter analyze failed with exit $ec but no 'error •'/'warning •' line was found in its output — full tail:%0A$(tail -c 3000 /tmp/analyze.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
            exit $ec
          fi

      - name: flutter test
        run: |
          set +e
          flutter test > /tmp/test.log 2>&1
          ec=$?
          cat /tmp/test.log
          if [ $ec -ne 0 ]; then
            echo "::error::flutter test failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/test.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $ec
          fi

      - name: flutter build apk --debug
        run: |
          set +e
          flutter build apk --debug > /tmp/apkdebug.log 2>&1
          ec=$?
          cat /tmp/apkdebug.log
          if [ $ec -ne 0 ]; then
            echo "::error::flutter build apk --debug failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/apkdebug.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $ec
          fi

      - name: flutter build apk --release (best effort — no release signing configured)
        id: release_apk
        continue-on-error: true
        run: flutter build apk --release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartok-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact (if it built)
        if: steps.release_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cartok-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Commit and push generated mobile/android/ back to the repo
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/android
          if git diff --cached --quiet; then
            echo "Nothing to commit — mobile/android/ already matches what's in the repo."
          else
            git commit -m "ci: persist generated mobile/android/ platform project [skip ci]" \
                       -m "Generated by this workflow's \"flutter create . --platforms=android\" step on a real GitHub Actions runner (run ${{ github.run_id }}), since the sandbox that otherwise develops this project has no Flutter SDK. applicationId/namespace already retargeted to com.cartok.app."
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi

  ios-project:
    name: iOS (generate + validate project, macOS runner required for any build)
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          # cache intentionally omitted — see the Android job's comment.

      - name: Generate iOS platform project (only if missing)
        run: |
          set +e
          if [ ! -d "ios" ]; then
            echo "mobile/ios/ does not exist — generating it with the real Flutter CLI."
            # Same reasoning as the Android job: --project-name stays "cartok" to
            # preserve existing package:cartok/... imports; the bundle identifier
            # is retargeted to com.cartok.app in the next step instead.
            flutter create . --platforms=ios --org com.cartok --project-name cartok > /tmp/create_ios.log 2>&1
            ec=$?
            cat /tmp/create_ios.log
            if [ $ec -ne 0 ]; then
              echo "::error::flutter create (ios) failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/create_ios.log | sed ':a;N;$!ba;s/\n/%0A/g')"
              exit $ec
            fi
            # Same reason as the Android job: remove the stock counter-app
            # placeholder test flutter create adds, which doesn't match
            # this project's real MyApp-less main.dart.
            if [ -f "test/widget_test.dart" ] && grep -q "MyApp" "test/widget_test.dart"; then
              rm -f "test/widget_test.dart"
              echo "Removed the generated placeholder test/widget_test.dart (stock counter-app template, not ours)."
            fi
          else
            echo "mobile/ios/ already exists — leaving it as-is."
          fi

      - name: Set iOS bundle identifier and display name
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ] && grep -q "com.cartok.cartok" "$PBXPROJ"; then
            sed -i '' 's/com\.cartok\.cartok/com.cartok.app/g' "$PBXPROJ"
            echo "Rewrote PRODUCT_BUNDLE_IDENTIFIER in $PBXPROJ to ${{ env.ANDROID_APP_ID }} (and .RunnerTests variant)"
          fi
          PLIST="ios/Runner/Info.plist"
          if [ -f "$PLIST" ] && grep -q "CFBundleDisplayName" "$PLIST"; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Cartok" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleName Cartok" "$PLIST" || true
          fi
          grep -E "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ" || echo "::warning::Could not find PRODUCT_BUNDLE_IDENTIFIER in $PBXPROJ — verify manually."

      - name: flutter pub get
        run: |
          set +e
          flutter pub get > /tmp/pubget_ios.log 2>&1
          ec=$?
          cat /tmp/pubget_ios.log
          if [ $ec -ne 0 ]; then
            echo "::error::flutter pub get (ios) failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/pubget_ios.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $ec
          fi

      - name: flutter analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze_ios.log 2>&1
          ec=$?
          cat /tmp/analyze_ios.log
          if [ $ec -ne 0 ]; then
            BLOCKING=$(grep -E "^\s*(error|warning) •" /tmp/analyze_ios.log)
            if [ -n "$BLOCKING" ]; then
              echo "::error::flutter analyze (ios) failed with exit $ec. The actual error/warning-level issue(s) (not the info-level ones below them):%0A$(echo "$BLOCKING" | sed ':a;N;$!ba;s/\n/%0A/g')"
            else
              echo "::error::flutter analyze (ios) failed with exit $ec but no 'error •'/'warning •' line was found in its output — full tail:%0A$(tail -c 3000 /tmp/analyze_ios.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
            exit $ec
          fi

      - name: flutter test
        run: |
          set +e
          flutter test > /tmp/test_ios.log 2>&1
          ec=$?
          cat /tmp/test_ios.log
          if [ $ec -ne 0 ]; then
            echo "::error::flutter test (ios) failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/test_ios.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $ec
          fi

      - name: Commit and push generated mobile/ios/ back to the repo
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/ios
          if git diff --cached --quiet; then
            echo "Nothing to commit — mobile/ios/ already matches what's in the repo."
          else
            git commit -m "ci: persist generated mobile/ios/ platform project [skip ci]" \
                       -m "Generated by this workflow's \"flutter create . --platforms=ios\" step on a real macOS GitHub Actions runner (run ${{ github.run_id }}), since the sandbox that otherwise develops this project has no Flutter SDK. Bundle identifier already retargeted to com.cartok.app."
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi

      - name: flutter build ios --no-codesign (unsigned validation build — not an .ipa)
        run: |
          set +e
          flutter build ios --no-codesign > /tmp/iosbuild.log 2>&1
          ec=$?
          cat /tmp/iosbuild.log
          if [ $ec -ne 0 ]; then
            echo "::error::flutter build ios --no-codesign (unsigned validation build — not an .ipa) failed with exit $ec. Last output:%0A$(tail -c 3000 /tmp/iosbuild.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $ec
          fi

      - name: Upload generated iOS project (for inspection / committing back)
        uses: actions/upload-artifact@v4
        with:
          name: cartok-ios-project
          path: mobile/ios
          if-no-files-found: error
